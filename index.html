<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쿠캣 - 렌지쿠캣/원팩쿠캣</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $(".tab li").eq(0).addClass("on");
      });
    </script>
  </head>
  <body>
    <div class="wrap">
      <!-- header -->
      <header>
        <div class="upper">
          <a href="#" class="logo"><img src="images/logo.svg" alt="logo" /></a>
          <div class="search">
            <p>오늘 뭐 먹지?</p>
            <img src="images/search.png" alt="search" />
          </div>
        </div>
        <nav>
          <a href="#">쿠캣추천</a>
          <a href="#">베스트</a>
          <a href="#">신상품</a>
          <a href="#">할인중</a>
          <a href="#">이벤트</a>
        </nav>
      </header>
      <!-- main -->
      <main>
        <section>banner</section>
        <section>category</section>
      </main>
      <!-- footer -->
      <footer></footer>
      <ul class="tab">
        <li>
          <a href="#"
            ><img src="images/home.svg" alt="home" />
            <p>홈</p></a
          >
        </li>
        <li>
          <a href="#"
            ><img src="images/singong.svg" alt="singong" />
            <p>쿠캣신공</p></a
          >
        </li>
        <li>
          <a href="#"
            ><img src="images/category.svg" alt="category" />
            <p>카테고리</p></a
          >
        </li>
        <li>
          <a href="#"
            ><img src="images/cart.svg" alt="cart" />
            <p>카트</p></a
          >
        </li>
        <li>
          <a href="#"
            ><img src="images/mycookat.svg" alt="my" />
            <p>마이쿠캣</p></a
          >
        </li>
      </ul>
      <aside>
        <img src="" alt="" />
      </aside>
    </div>
    <div class="apply">
      <img src="images/apply.png" alt="apply" />
      <div class="qr">
        <a href="#">
          <img src="images/qr.png" alt="qr" />
        </a>
        <div class="qr-desc">
          <p><span>앱 설치</span>하고</p>
          <p><span>할인소식</span>알림받기 !</p>
          <span>다운로드로 연결됩니다.</span>
        </div>
      </div>
    </div>
  </body>
</html>
